<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PontoView • Previsão do Tempo</title>

  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --pv-blue:#08479a;
      --pv-blue-deep:#042f6a;
      --pv-sky:#69cff2;
      --pv-white:#f7fbff;
      --pv-soft:rgba(247,251,255,.72);
      --pv-faint:rgba(247,251,255,.46);
      --panel:rgba(255,255,255,.08);
      --panel-strong:rgba(255,255,255,.12);
      --line:rgba(255,255,255,.14);
      --accent-opacity:.24;
      --bg-top:#0a4ea5;
      --bg-bottom:#043775;
      --wx-color:#d8f2ff;
    }

    *{box-sizing:border-box}
    html,body{height:100%}

    body{
      margin:0;
      overflow:hidden;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--pv-white);
      background:linear-gradient(145deg,var(--bg-top),var(--bg-bottom));
      transition:background 1.2s ease;
    }

    .ambient,
    .ambient::before,
    .ambient::after{
      position:fixed;
      inset:-20%;
      pointer-events:none;
      content:"";
      z-index:0;
    }

    .ambient{
      background:
        radial-gradient(circle at 20% 22%, rgba(105,207,242,var(--accent-opacity)) 0 9%, transparent 31%),
        radial-gradient(circle at 82% 30%, rgba(255,255,255,.08) 0 8%, transparent 30%),
        radial-gradient(circle at 66% 82%, rgba(105,207,242,.12) 0 10%, transparent 34%);
      animation:ambientFloat 20s ease-in-out infinite alternate;
    }

    .ambient::before{
      border:clamp(14px,1.4vw,24px) solid rgba(105,207,242,.10);
      border-left-color:transparent;
      border-bottom-color:transparent;
      border-radius:50%;
      width:34vw;
      height:34vw;
      min-width:420px;
      min-height:420px;
      left:auto;
      right:-9vw;
      top:-10vw;
      bottom:auto;
      animation:ringOne 34s linear infinite;
    }

    .ambient::after{
      border:clamp(10px,1vw,18px) solid rgba(255,255,255,.06);
      border-top-color:transparent;
      border-right-color:transparent;
      border-radius:50%;
      width:28vw;
      height:28vw;
      min-width:330px;
      min-height:330px;
      left:-8vw;
      bottom:-12vw;
      top:auto;
      right:auto;
      animation:ringTwo 42s linear infinite reverse;
    }

    @keyframes ambientFloat{
      from{transform:translate3d(-1.5%,0,0) scale(1)}
      to{transform:translate3d(1.5%,-1%,0) scale(1.03)}
    }
    @keyframes ringOne{to{transform:rotate(360deg)}}
    @keyframes ringTwo{to{transform:rotate(360deg)}}

    .app{
      position:relative;
      z-index:1;
      width:100%;
      height:100%;
      padding:clamp(28px,3.3vw,56px) clamp(34px,4vw,72px) clamp(26px,3vw,48px);
      display:flex;
      flex-direction:column;
    }

    .topbar{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:28px;
      margin-bottom:clamp(28px,3.2vh,44px);
    }

    .heading{
      display:flex;
      align-items:center;
      gap:16px;
      min-width:0;
    }

    .heading img{
      width:clamp(46px,4vw,64px);
      height:clamp(46px,4vw,64px);
      object-fit:contain;
      flex:0 0 auto;
    }

    .title-wrap{min-width:0}
    .eyebrow{
      font-size:clamp(11px,.95vw,14px);
      font-weight:600;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:var(--pv-sky);
      margin-bottom:7px;
    }

    .place{
      display:flex;
      align-items:center;
      gap:9px;
      font-size:clamp(25px,2.5vw,40px);
      font-weight:650;
      line-height:1;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:62vw;
    }

    .place .material-icons-outlined{
      color:var(--pv-sky);
      font-size:.78em;
    }

    .clock-box{text-align:right;flex:0 0 auto}
    .clock{
      font-size:clamp(34px,3.2vw,52px);
      font-weight:500;
      letter-spacing:-.03em;
      font-variant-numeric:tabular-nums;
      line-height:.95;
    }
    .clock-date{
      margin-top:8px;
      font-size:clamp(10px,.9vw,13px);
      letter-spacing:.12em;
      text-transform:uppercase;
      color:var(--pv-soft);
      white-space:nowrap;
    }

    .content{
      flex:1;
      display:grid;
      grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);
      gap:clamp(24px,3vw,48px);
      min-height:0;
    }

    .current{
      display:grid;
      grid-template-rows:minmax(0,1fr) auto;
      gap:20px;
      min-height:0;
    }

    .hero{
      display:grid;
      grid-template-columns:minmax(210px,.78fr) minmax(0,1fr);
      align-items:center;
      gap:clamp(18px,2.6vw,36px);
      min-height:0;
    }

    .weather-visual{
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:260px;
      position:relative;
    }

    .weather-orb{
      width:min(26vw,330px);
      aspect-ratio:1;
      min-width:230px;
      border-radius:50%;
      background:radial-gradient(circle at 38% 32%, rgba(255,255,255,.15), rgba(105,207,242,.08) 46%, rgba(255,255,255,.025) 70%);
      border:1px solid rgba(255,255,255,.10);
      display:grid;
      place-items:center;
      animation:orbBreath 5.5s ease-in-out infinite;
      position:relative;
    }

    .weather-orb::after{
      content:"";
      position:absolute;
      inset:12%;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.05);
      animation:orbSpin 18s linear infinite;
    }

    .weather-icon{
      font-family:'Material Icons Outlined';
      font-size:clamp(112px,11vw,168px);
      color:var(--wx-color);
      line-height:1;
      filter:drop-shadow(0 18px 28px rgba(0,0,0,.12));
      animation:iconFloat 4.8s ease-in-out infinite;
      z-index:1;
    }

    @keyframes orbBreath{50%{transform:scale(1.025)}}
    @keyframes orbSpin{to{transform:rotate(360deg)}}
    @keyframes iconFloat{50%{transform:translateY(-8px) rotate(-2deg)}}

    .now-info{min-width:0}
    .temp-row{
      display:flex;
      align-items:flex-start;
      gap:12px;
    }
    .temp-big{
      font-size:clamp(96px,10.8vw,176px);
      font-weight:300;
      letter-spacing:-.07em;
      line-height:.82;
      font-variant-numeric:tabular-nums;
    }
    .degree-unit{
      font-size:clamp(20px,2vw,30px);
      color:var(--pv-sky);
      margin-top:8px;
      font-weight:600;
    }
    .desc{
      margin-top:18px;
      font-size:clamp(20px,2vw,32px);
      font-weight:600;
      line-height:1.14;
      color:var(--pv-white);
      max-width:430px;
    }
    .today-range{
      margin-top:16px;
      display:flex;
      align-items:center;
      gap:18px;
      font-size:clamp(15px,1.25vw,19px);
      color:var(--pv-soft);
    }
    .today-range b{color:var(--pv-white);font-weight:600}
    .today-range .min{color:var(--pv-sky)}

    .metrics{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:12px;
    }

    .metric{
      min-height:118px;
      border-radius:22px;
      background:var(--panel);
      border:1px solid var(--line);
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:flex-start;
      padding:18px;
    }

    .metric-top{
      display:flex;
      align-items:center;
      gap:9px;
      margin-bottom:14px;
      color:var(--pv-sky);
    }
    .metric-top .material-icons-outlined{font-size:27px}
    .metric-label{
      font-size:11px;
      font-weight:600;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:var(--pv-soft);
    }
    .metric-value{
      font-size:clamp(22px,2vw,30px);
      font-weight:650;
      line-height:1;
      white-space:nowrap;
    }

    .forecast{
      min-height:0;
      display:flex;
      flex-direction:column;
    }

    .forecast-head{
      display:flex;
      justify-content:space-between;
      align-items:end;
      gap:16px;
      margin-bottom:16px;
    }
    .forecast-title{
      font-size:clamp(16px,1.3vw,20px);
      font-weight:650;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    .range{
      font-size:12px;
      letter-spacing:.11em;
      color:var(--pv-faint);
      text-transform:uppercase;
    }

    .days{
      flex:1;
      display:grid;
      grid-template-rows:repeat(6,minmax(0,1fr));
      gap:10px;
      min-height:0;
    }

    .day{
      display:grid;
      grid-template-columns:94px 74px minmax(0,1fr) 150px;
      align-items:center;
      gap:16px;
      padding:12px 18px;
      border-radius:20px;
      background:var(--panel);
      border:1px solid var(--line);
      min-height:0;
    }

    .day.today{
      background:var(--panel-strong);
      border-color:rgba(105,207,242,.34);
    }

    .day-date{
      display:flex;
      flex-direction:column;
      line-height:1.05;
    }
    .day-label{
      font-size:clamp(14px,1.25vw,18px);
      font-weight:650;
      text-transform:uppercase;
    }
    .day-number{
      margin-top:5px;
      font-size:12px;
      color:var(--pv-faint);
    }

    .day-icon{
      font-family:'Material Icons Outlined';
      font-size:46px;
      color:var(--day-color,#d8f2ff);
      line-height:1;
      animation:dayIconFloat 4s ease-in-out infinite;
      animation-delay:var(--delay,0s);
    }
    @keyframes dayIconFloat{50%{transform:translateY(-4px)}}

    .day-meta{min-width:0}
    .day-desc{
      font-size:clamp(14px,1.2vw,18px);
      font-weight:600;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .rain-line{
      display:flex;
      align-items:center;
      gap:7px;
      margin-top:7px;
      color:var(--pv-soft);
      font-size:12px;
    }
    .rain-line .material-icons-outlined{font-size:16px;color:var(--pv-sky)}

    .temps{
      display:flex;
      justify-content:flex-end;
      gap:18px;
      font-variant-numeric:tabular-nums;
    }
    .temp-chip{text-align:center;min-width:48px}
    .temp-chip small{
      display:block;
      font-size:9px;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:var(--pv-faint);
      margin-bottom:4px;
    }
    .temp-chip strong{
      font-size:clamp(18px,1.5vw,23px);
      font-weight:650;
    }
    .temp-chip.min strong{color:var(--pv-sky)}

    .footer{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:18px;
      padding-top:14px;
      font-size:10px;
      text-transform:uppercase;
      letter-spacing:.12em;
      color:var(--pv-faint);
    }

    .brand img{
      height:clamp(21px,1.9vw,30px);
      width:auto;
      display:block;
      filter:brightness(0) invert(1);
      opacity:.86;
    }

    @media (max-width:1100px){
      body{overflow:auto}
      .app{height:auto;min-height:100%;padding:24px}
      .content{grid-template-columns:1fr}
      .hero{grid-template-columns:1fr 1fr}
      .metrics{grid-template-columns:repeat(2,1fr)}
      .days{grid-template-rows:none}
      .day{min-height:92px}
    }

    @media (max-width:700px){
      .topbar{gap:16px;align-items:center}
      .heading img{display:none}
      .place{font-size:25px;max-width:55vw}
      .clock-date{display:none}
      .hero{grid-template-columns:1fr}
      .weather-visual{min-height:210px}
      .weather-orb{min-width:205px;width:205px}
      .metrics{grid-template-columns:1fr 1fr}
      .day{grid-template-columns:72px 48px minmax(0,1fr) 105px;gap:10px;padding:10px 12px}
      .day-icon{font-size:38px}
      .rain-line{display:none}
      .temps{gap:8px}
      .footer{flex-wrap:wrap}
    }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>

  <main class="app">
    <header class="topbar">
      <div class="heading">
        <img src="assets/icon.png" alt="" aria-hidden="true">
        <div class="title-wrap">
          <div class="eyebrow">Previsão do Tempo</div>
          <div class="place">
            <span class="material-icons-outlined" aria-hidden="true">location_on</span>
            <span id="place">Localizando…</span>
          </div>
        </div>
      </div>

      <div class="clock-box">
        <div class="clock" id="clock">--:--</div>
        <div class="clock-date" id="clockDate">—</div>
      </div>
    </header>

    <section class="content">
      <div class="current">
        <div class="hero">
          <div class="weather-visual" aria-hidden="true">
            <div class="weather-orb">
              <span class="weather-icon" id="wxIcon">cloud</span>
            </div>
          </div>

          <div class="now-info">
            <div class="temp-row">
              <div class="temp-big" id="tempNow">--°</div>
              <div class="degree-unit">C</div>
            </div>
            <div class="desc" id="descNow">—</div>
            <div class="today-range">
              <span>mín <b class="min" id="todayMin">--°</b></span>
              <span>máx <b id="todayMax">--°</b></span>
            </div>
          </div>
        </div>

        <div class="metrics" aria-label="Condições atuais">
          <div class="metric">
            <div class="metric-top"><span class="material-icons-outlined">device_thermostat</span><span class="metric-label">Sensação</span></div>
            <div class="metric-value" id="feels">—</div>
          </div>
          <div class="metric">
            <div class="metric-top"><span class="material-icons-outlined">air</span><span class="metric-label">Vento</span></div>
            <div class="metric-value" id="wind">—</div>
          </div>
          <div class="metric">
            <div class="metric-top"><span class="material-icons-outlined">humidity_percentage</span><span class="metric-label">Umidade</span></div>
            <div class="metric-value" id="humidity">—</div>
          </div>
          <div class="metric">
            <div class="metric-top"><span class="material-icons-outlined">water_drop</span><span class="metric-label">Chuva</span></div>
            <div class="metric-value" id="rain">—</div>
          </div>
        </div>
      </div>

      <div class="forecast">
        <div class="forecast-head">
          <div class="forecast-title">Próximos dias</div>
          <div class="range" id="range">—</div>
        </div>
        <div class="days" id="days"></div>
      </div>
    </section>

    <footer class="footer">
      <span id="updated">Atualizando…</span>
      <div class="brand"><img src="assets/logo.png" alt=""></div>
      <span>Dados meteorológicos: Open-Meteo</span>
    </footer>
  </main>

  <script>
    const weekday = ["DOMINGO","SEGUNDA","TERÇA","QUARTA","QUINTA","SEXTA","SÁBADO"];
    const month = ["JANEIRO","FEVEREIRO","MARÇO","ABRIL","MAIO","JUNHO","JULHO","AGOSTO","SETEMBRO","OUTUBRO","NOVEMBRO","DEZEMBRO"];
    const dowShort = ["DOM","SEG","TER","QUA","QUI","SEX","SÁB"];

    const clockEl = document.getElementById("clock");
    const clockDateEl = document.getElementById("clockDate");
    const placeEl = document.getElementById("place");
    const wxIconEl = document.getElementById("wxIcon");
    const tempNowEl = document.getElementById("tempNow");
    const descNowEl = document.getElementById("descNow");
    const feelsEl = document.getElementById("feels");
    const windEl = document.getElementById("wind");
    const humidityEl = document.getElementById("humidity");
    const rainEl = document.getElementById("rain");
    const updatedEl = document.getElementById("updated");
    const daysEl = document.getElementById("days");
    const rangeEl = document.getElementById("range");
    const todayMinEl = document.getElementById("todayMin");
    const todayMaxEl = document.getElementById("todayMax");

    function pad2(n){return String(n).padStart(2,"0")}

    function updateClock(){
      const d = new Date();
      clockEl.textContent = `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
      clockDateEl.textContent = `${weekday[d.getDay()]}, ${pad2(d.getDate())} DE ${month[d.getMonth()]}`;
    }

    (function startClock(){
      updateClock();
      const ms = 1000 - new Date().getMilliseconds();
      setTimeout(() => {updateClock(); setInterval(updateClock,1000)},ms);
    })();

    function applyDayMoment(){
      const hour = new Date().getHours();
      const root = document.documentElement;
      if(hour >= 6 && hour < 12){
        root.style.setProperty("--bg-top","#0b56ad");
        root.style.setProperty("--bg-bottom","#08458f");
        root.style.setProperty("--accent-opacity",".30");
      }else if(hour >= 12 && hour < 18){
        root.style.setProperty("--bg-top","#0a4ea5");
        root.style.setProperty("--bg-bottom","#043775");
        root.style.setProperty("--accent-opacity",".24");
      }else{
        root.style.setProperty("--bg-top","#063a7c");
        root.style.setProperty("--bg-bottom","#022656");
        root.style.setProperty("--accent-opacity",".18");
      }
    }
    applyDayMoment();
    setInterval(applyDayMoment,10*60*1000);

    function fetchWithTimeout(url,opts={},timeoutMs=4500){
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(),timeoutMs);
      return fetch(url,{...opts,signal:ctrl.signal}).finally(() => clearTimeout(t));
    }

    function normStr(v){
      if(v == null) return null;
      const s = String(v).trim();
      return s ? s : null;
    }

    function toNum(v){
      const n = Number(v);
      return Number.isFinite(n) ? n : null;
    }

    async function getIpLocationRobust(){
      const providers = [
        async () => {
          const r = await fetchWithTimeout("https://ipwho.is/?lang=pt",{cache:"no-store"});
          const d = await r.json();
          if(!d || d.success === false) throw new Error("ipwho.is failed");
          return {city:normStr(d.city),region:normStr(d.region_code || d.region),country:normStr(d.country_code),lat:toNum(d.latitude),lon:toNum(d.longitude)};
        },
        async () => {
          const r = await fetchWithTimeout("https://ipapi.co/json/",{cache:"no-store"});
          const d = await r.json();
          return {city:normStr(d.city),region:normStr(d.region_code || d.region),country:normStr(d.country_code),lat:toNum(d.latitude),lon:toNum(d.longitude)};
        },
        async () => {
          const r = await fetchWithTimeout("https://geolocation-db.com/json/",{cache:"no-store"});
          const d = await r.json();
          return {city:normStr(d.city),region:normStr(d.state),country:normStr(d.country_code),lat:toNum(d.latitude),lon:toNum(d.longitude)};
        }
      ];

      let lastErr = null;
      for(const provider of providers){
        try{
          const loc = await provider();
          if(loc.city || (loc.lat != null && loc.lon != null)) return loc;
          lastErr = new Error("empty location");
        }catch(e){lastErr = e}
      }
      throw lastErr || new Error("all providers failed");
    }

    function formatPlaceUpper(loc){
      const city = loc.city ? loc.city.toUpperCase() : null;
      const region = loc.region ? loc.region.toUpperCase() : null;
      const country = loc.country ? loc.country.toUpperCase() : null;
      if(city && region) return `${city} · ${region}`;
      if(city && country) return `${city} · ${country}`;
      if(city) return city;
      return "LOCAL NÃO IDENTIFICADO";
    }

    function wxFromCode(code){
      if(code === 0) return {icon:"wb_sunny",desc:"CÉU LIMPO",color:"#ffd36b"};
      if(code === 1 || code === 2) return {icon:"partly_cloudy_day",desc:"PARCIALMENTE NUBLADO",color:"#d7f2ff"};
      if(code === 3) return {icon:"cloud",desc:"NUBLADO",color:"#d7e9f7"};
      if(code === 45 || code === 48) return {icon:"foggy",desc:"NEBLINA",color:"#dbe8ef"};
      if([51,53,55].includes(code)) return {icon:"grain",desc:"GAROA",color:"#8edcff"};
      if([56,57].includes(code)) return {icon:"ac_unit",desc:"GAROA CONGELANTE",color:"#d6eeff"};
      if([61,63,65].includes(code)) return {icon:"rainy",desc:"CHUVA",color:"#72d0ff"};
      if([66,67].includes(code)) return {icon:"weather_mix",desc:"CHUVA CONGELANTE",color:"#cbe9ff"};
      if([71,73,75,77].includes(code)) return {icon:"ac_unit",desc:"NEVE",color:"#edf8ff"};
      if([80,81,82].includes(code)) return {icon:"rainy",desc:"PANCADAS DE CHUVA",color:"#69cff2"};
      if([85,86].includes(code)) return {icon:"ac_unit",desc:"PANCADAS DE NEVE",color:"#edf8ff"};
      if([95,96,99].includes(code)) return {icon:"thunderstorm",desc:"TEMPESTADE",color:"#b9d7ff"};
      return {icon:"cloud",desc:"CLIMA",color:"#d8f2ff"};
    }

    function fmtDayLabel(isoDate,index){
      if(index === 0) return "HOJE";
      if(index === 1) return "AMANHÃ";
      const d = new Date(isoDate + "T12:00:00");
      return dowShort[d.getDay()];
    }

    function fmtDayNumber(isoDate){
      const d = new Date(isoDate + "T12:00:00");
      return `${pad2(d.getDate())}/${pad2(d.getMonth()+1)}`;
    }

    function fmtRange(startISO,endISO){
      return `${fmtDayNumber(startISO)} · ${fmtDayNumber(endISO)}`;
    }

    async function fetchWeather(lat,lon){
      const url = new URL("https://api.open-meteo.com/v1/forecast");
      url.searchParams.set("latitude",String(lat));
      url.searchParams.set("longitude",String(lon));
      url.searchParams.set("timezone","auto");
      url.searchParams.set("current","temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m");
      url.searchParams.set("daily","weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max");
      url.searchParams.set("forecast_days","6");
      const r = await fetchWithTimeout(url.toString(),{cache:"no-store"},6500);
      return r.json();
    }

    function renderDaily(daily){
      daysEl.innerHTML = "";
      const times = daily.time || [];
      const code = daily.weather_code || [];
      const tmax = daily.temperature_2m_max || [];
      const tmin = daily.temperature_2m_min || [];
      const pop = daily.precipitation_probability_max || [];

      if(!times.length){
        daysEl.innerHTML = `<div style="color:var(--pv-soft)">Sem dados de previsão.</div>`;
        return;
      }

      rangeEl.textContent = fmtRange(times[0],times[times.length-1]);
      todayMinEl.textContent = Number.isFinite(tmin[0]) ? `${Math.round(tmin[0])}°` : "--°";
      todayMaxEl.textContent = Number.isFinite(tmax[0]) ? `${Math.round(tmax[0])}°` : "--°";

      const frag = document.createDocumentFragment();
      times.forEach((date,i) => {
        const w = wxFromCode(code[i]);
        const el = document.createElement("div");
        el.className = `day${i === 0 ? " today" : ""}`;
        el.innerHTML = `
          <div class="day-date">
            <span class="day-label">${fmtDayLabel(date,i)}</span>
            <span class="day-number">${fmtDayNumber(date)}</span>
          </div>
          <span class="day-icon" style="--day-color:${w.color};--delay:${(i*.28).toFixed(2)}s">${w.icon}</span>
          <div class="day-meta">
            <div class="day-desc">${w.desc}</div>
            <div class="rain-line"><span class="material-icons-outlined">water_drop</span><span>${Number.isFinite(pop[i]) ? `${Math.round(pop[i])}%` : "—"}</span></div>
          </div>
          <div class="temps">
            <div class="temp-chip min"><small>mín</small><strong>${Number.isFinite(tmin[i]) ? `${Math.round(tmin[i])}°` : "—"}</strong></div>
            <div class="temp-chip"><small>máx</small><strong>${Number.isFinite(tmax[i]) ? `${Math.round(tmax[i])}°` : "—"}</strong></div>
          </div>`;
        frag.appendChild(el);
      });
      daysEl.appendChild(frag);
    }

    function setUpdated(){
      const d = new Date();
      updatedEl.textContent = `Atualizado às ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    }

    async function refresh(){
      try{
        placeEl.textContent = "LOCALIZANDO…";
        const loc = await getIpLocationRobust();
        placeEl.textContent = formatPlaceUpper(loc);

        if(loc.lat == null || loc.lon == null) throw new Error("no coordinates");

        const data = await fetchWeather(loc.lat,loc.lon);
        const cur = data.current || {};
        const w = wxFromCode(cur.weather_code);

        wxIconEl.textContent = w.icon;
        descNowEl.textContent = w.desc;
        document.documentElement.style.setProperty("--wx-color",w.color);

        const t = Number(cur.temperature_2m);
        tempNowEl.textContent = Number.isFinite(t) ? `${Math.round(t)}°` : "--°";

        const feels = Number(cur.apparent_temperature);
        feelsEl.textContent = Number.isFinite(feels) ? `${Math.round(feels)}°` : "—";

        const wind = Number(cur.wind_speed_10m);
        windEl.textContent = Number.isFinite(wind) ? `${Math.round(wind)} km/h` : "—";

        const hum = Number(cur.relative_humidity_2m);
        humidityEl.textContent = Number.isFinite(hum) ? `${Math.round(hum)}%` : "—";

        const rain = Number(cur.precipitation);
        rainEl.textContent = Number.isFinite(rain) ? `${rain.toFixed(1)} mm` : "—";

        if(data.daily) renderDaily(data.daily);
        setUpdated();
      }catch(e){
        placeEl.textContent = "SEM CONEXÃO";
        wxIconEl.textContent = "cloud_off";
        descNowEl.textContent = "DADOS INDISPONÍVEIS";
        setUpdated();
        console.warn(e);
      }
    }

    refresh();
    setInterval(refresh,20*60*1000);
  </script>
</body>
</html>

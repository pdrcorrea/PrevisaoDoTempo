<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PontoView • Previsão do Tempo</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--sky:#69cff2;--white:#f7fbff;--soft:rgba(247,251,255,.72);--faint:rgba(247,251,255,.46);--panel:rgba(255,255,255,.08);--panel2:rgba(255,255,255,.12);--line:rgba(255,255,255,.14);--bg1:#0a4ea5;--bg2:#043775;--wx:#d8f2ff}
*{box-sizing:border-box}html,body{width:100%;height:100%}body{margin:0;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:var(--white);background:linear-gradient(145deg,var(--bg1),var(--bg2))}
.ambient{position:fixed;inset:-18%;pointer-events:none;background:radial-gradient(circle at 18% 22%,rgba(105,207,242,.25),transparent 30%),radial-gradient(circle at 82% 30%,rgba(255,255,255,.07),transparent 28%),radial-gradient(circle at 68% 82%,rgba(105,207,242,.11),transparent 34%);animation:ambient 20s ease-in-out infinite alternate}
.ambient:before,.ambient:after{content:"";position:absolute;border-radius:50%;pointer-events:none}.ambient:before{width:min(38vw,620px);aspect-ratio:1;right:-8vw;top:-10vw;border:18px solid rgba(105,207,242,.08);border-left-color:transparent;border-bottom-color:transparent;animation:spin 36s linear infinite}.ambient:after{width:min(30vw,500px);aspect-ratio:1;left:-8vw;bottom:-10vw;border:13px solid rgba(255,255,255,.05);border-top-color:transparent;border-right-color:transparent;animation:spin 44s linear infinite reverse}
@keyframes ambient{to{transform:translate3d(2%,-1%,0) scale(1.03)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{50%{transform:translateY(-4px)}}@keyframes breathe{50%{transform:scale(1.025)}}@keyframes heat{0%,100%{opacity:.18;transform:translateY(8px)}50%{opacity:.55;transform:translateY(-8px)}}@keyframes cold{0%,100%{opacity:.18;transform:rotate(0)}50%{opacity:.55;transform:rotate(18deg)}}
.app{position:relative;z-index:1;width:100%;height:100%;padding:clamp(22px,3vw,48px) clamp(30px,4vw,68px) clamp(18px,2.4vw,36px);display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:clamp(16px,2vh,28px)}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}.heading{display:flex;align-items:center;gap:14px;min-width:0}.heading img{width:clamp(48px,4vw,64px);height:clamp(48px,4vw,64px);object-fit:contain}.eyebrow{font-size:clamp(11px,.9vw,14px);font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--sky);margin-bottom:6px}.place{display:flex;align-items:center;gap:8px;font-size:clamp(24px,2.3vw,38px);font-weight:650;white-space:nowrap}.place .material-icons-outlined{font-size:.8em;color:var(--sky)}.clockbox{text-align:right}.clock{font-size:clamp(34px,3vw,50px);font-weight:500;line-height:.95}.clockdate{margin-top:8px;font-size:clamp(10px,.82vw,13px);letter-spacing:.12em;color:var(--soft);text-transform:uppercase;white-space:nowrap}
.content{min-height:0;display:grid;grid-template-columns:minmax(0,46%) minmax(0,54%);gap:clamp(24px,3vw,46px)}.current{min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:16px}.hero{min-height:0;display:grid;grid-template-columns:minmax(170px,42%) minmax(0,58%);align-items:center;gap:18px}.visual{display:flex;align-items:center;justify-content:center;min-width:0}.orb{width:min(21vw,300px);max-width:100%;aspect-ratio:1;border-radius:50%;border:1px solid rgba(255,255,255,.1);background:radial-gradient(circle at 38% 32%,rgba(255,255,255,.15),rgba(105,207,242,.08) 46%,rgba(255,255,255,.025) 70%);display:grid;place-items:center;animation:breathe 5.5s ease-in-out infinite}.wx-icon{font-family:'Material Icons Outlined';font-size:clamp(84px,8vw,132px);line-height:1;color:var(--wx);display:block;width:1em;height:1em;text-align:center;overflow:hidden;animation:float 4.8s ease-in-out infinite}.now{min-width:0}.temp-row{display:flex;align-items:flex-start;gap:8px}.temp{font-size:clamp(84px,8.1vw,136px);font-weight:300;letter-spacing:-.06em;line-height:.84;white-space:nowrap}.unit{font-size:clamp(18px,1.7vw,28px);color:var(--sky);margin-top:7px;font-weight:600}.desc{margin-top:16px;font-size:clamp(18px,1.6vw,26px);font-weight:600;line-height:1.15;overflow-wrap:anywhere}.range-now{margin-top:14px;display:flex;gap:16px;flex-wrap:wrap;color:var(--soft);font-size:clamp(14px,1.05vw,17px)}.range-now b{color:#fff}.range-now .min{color:var(--sky)}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.metric{position:relative;min-width:0;min-height:104px;border-radius:20px;background:var(--panel);border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;isolation:isolate}.metric-top{display:flex;align-items:center;gap:7px;margin-bottom:11px;color:var(--sky)}.metric-top .material-icons-outlined{font-size:24px;line-height:1}.metric-label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);white-space:nowrap}.metric-value{font-size:clamp(19px,1.65vw,27px);font-weight:650;white-space:nowrap}.metric.feel-hot{border-color:rgba(255,190,95,.5);background:linear-gradient(135deg,rgba(255,166,76,.16),var(--panel))}.metric.feel-hot .metric-top{color:#ffd08a}.metric.feel-cold{border-color:rgba(130,220,255,.52);background:linear-gradient(135deg,rgba(105,207,242,.18),var(--panel))}.metric.feel-hot:after,.metric.feel-cold:after{font-family:'Material Icons Outlined';position:absolute;right:8px;bottom:-8px;font-size:54px;z-index:-1}.metric.feel-hot:after{content:"whatshot";color:#ffd08a;animation:heat 3s ease-in-out infinite}.metric.feel-cold:after{content:"ac_unit";color:#bcecff;animation:cold 5s ease-in-out infinite}
.forecast{min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr)}.forecast-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:12px}.forecast-title{font-size:clamp(16px,1.25vw,20px);font-weight:650;letter-spacing:.08em;text-transform:uppercase}.range{font-size:11px;letter-spacing:.11em;color:var(--faint);text-transform:uppercase}.days{min-height:0;display:grid;grid-template-rows:repeat(6,minmax(0,1fr));gap:9px}.day{min-width:0;display:grid;grid-template-columns:88px 56px minmax(0,1fr) 128px;align-items:center;gap:12px;padding:9px 14px;border-radius:18px;background:var(--panel);border:1px solid var(--line);overflow:hidden}.day.today{background:var(--panel2);border-color:rgba(105,207,242,.34)}.day-date{display:flex;flex-direction:column;line-height:1.05}.day-label{font-size:clamp(13px,1.05vw,17px);font-weight:650;text-transform:uppercase;white-space:nowrap}.day-number{margin-top:5px;font-size:11px;color:var(--faint)}.day-icon{font-family:'Material Icons Outlined';font-size:clamp(34px,2.8vw,42px);line-height:1;color:var(--day,#d8f2ff);display:grid;place-items:center;width:48px;height:48px;overflow:hidden;animation:float 4s ease-in-out infinite}.day-meta{min-width:0;overflow:hidden}.day-desc{font-size:clamp(13px,1.05vw,17px);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rain{display:flex;align-items:center;gap:6px;margin-top:5px;color:var(--soft);font-size:11px}.rain .material-icons-outlined{font-size:15px;color:var(--sky)}.temps{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center}.chip small{display:block;font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:3px}.chip strong{font-size:clamp(17px,1.35vw,22px)}.chip.min strong{color:var(--sky)}
.footer{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--faint)}.footer>:last-child{text-align:right}.brand img{height:clamp(21px,1.8vw,28px);filter:brightness(0) invert(1);opacity:.86}
@media (orientation:landscape) and (max-height:760px){.app{padding-top:18px;padding-bottom:14px;gap:13px}.heading img{width:46px;height:46px}.place{font-size:26px}.clock{font-size:36px}.content{gap:26px}.hero{grid-template-columns:minmax(145px,40%) minmax(0,60%)}.orb{width:min(17vw,220px)}.wx-icon{font-size:96px}.temp{font-size:102px}.desc{font-size:18px;margin-top:10px}.metric{min-height:84px;padding:10px 12px}.metric-top{margin-bottom:7px}.metric-value{font-size:20px}.day{grid-template-columns:74px 46px minmax(0,1fr) 108px;padding:6px 11px;gap:9px}.day-icon{width:40px;height:40px;font-size:32px}.rain{margin-top:2px}.footer{font-size:8px}}
@media (orientation:portrait),(max-aspect-ratio:4/5){.app{padding:clamp(26px,5vw,50px) clamp(22px,5vw,48px) clamp(20px,4vw,38px);gap:20px}.heading{gap:12px}.heading img{width:56px;height:56px}.place{font-size:clamp(24px,4.1vw,36px)}.clock{font-size:clamp(30px,5.4vw,44px)}.clockdate{font-size:9px;white-space:normal;max-width:190px}.content{grid-template-columns:1fr;grid-template-rows:minmax(0,42%) minmax(0,58%);gap:22px}.hero{grid-template-columns:minmax(0,42%) minmax(0,58%)}.orb{width:min(33vw,280px)}.wx-icon{font-size:clamp(88px,17vw,144px)}.temp{font-size:clamp(92px,17vw,148px)}.desc{font-size:clamp(18px,3.2vw,27px)}.metrics{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.metric{min-height:92px;padding:12px}.metric-label{font-size:9px}.metric-value{font-size:clamp(17px,2.8vw,23px)}.day{grid-template-columns:clamp(68px,13vw,96px) 48px minmax(0,1fr) clamp(104px,19vw,142px);gap:9px;padding:9px 12px}.day-icon{width:42px;height:42px;font-size:35px}.footer{font-size:8px}}
@media (orientation:portrait) and (max-width:620px){.app{padding-left:18px;padding-right:18px}.heading img{display:none}.clockdate{display:none}.hero{grid-template-columns:126px minmax(0,1fr);gap:12px}.orb{width:122px}.wx-icon{font-size:72px}.temp{font-size:82px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.metric{min-height:72px}.day{grid-template-columns:56px 36px minmax(0,1fr) 80px;gap:6px;padding:7px 8px}.day-icon{width:32px;height:32px;font-size:28px}.day-desc{font-size:12px}.rain{display:none}.chip strong{font-size:14px}.footer{grid-template-columns:1fr auto}.footer>:last-child{display:none}}
@media (prefers-reduced-motion:reduce){.ambient,.ambient:before,.ambient:after,.orb,.wx-icon,.day-icon,.metric:after{animation:none!important}}
</style>
</head>
<body>
<div class="ambient" aria-hidden="true"></div>
<main class="app">
<header class="topbar"><div class="heading"><img src="assets/icon.png" alt=""><div><div class="eyebrow">Previsão do Tempo</div><div class="place"><span class="material-icons-outlined">location_on</span><span id="place">Localizando…</span></div></div></div><div class="clockbox"><div class="clock" id="clock">--:--</div><div class="clockdate" id="clockDate">—</div></div></header>
<section class="content">
<div class="current"><div class="hero"><div class="visual"><div class="orb"><span class="wx-icon" id="wxIcon">cloud</span></div></div><div class="now"><div class="temp-row"><div class="temp" id="tempNow">--°</div><div class="unit">C</div></div><div class="desc" id="descNow">—</div><div class="range-now"><span>mín <b class="min" id="todayMin">--°</b></span><span>máx <b id="todayMax">--°</b></span></div></div></div>
<div class="metrics"><div class="metric" id="feelCard"><div class="metric-top"><span class="material-icons-outlined" id="feelIcon">device_thermostat</span><span class="metric-label">Sensação</span></div><div class="metric-value" id="feels">—</div></div><div class="metric"><div class="metric-top"><span class="material-icons-outlined">air</span><span class="metric-label">Vento</span></div><div class="metric-value" id="wind">—</div></div><div class="metric"><div class="metric-top"><span class="material-icons-outlined">opacity</span><span class="metric-label">Umidade</span></div><div class="metric-value" id="humidity">—</div></div><div class="metric"><div class="metric-top"><span class="material-icons-outlined">water_drop</span><span class="metric-label">Chuva</span></div><div class="metric-value" id="rain">—</div></div></div></div>
<div class="forecast"><div class="forecast-head"><div class="forecast-title">Próximos dias</div><div class="range" id="range">—</div></div><div class="days" id="days"></div></div>
</section>
<footer class="footer"><span id="updated">Atualizando…</span><div class="brand"><img src="assets/logo.png" alt=""></div><span>Dados meteorológicos: Open-Meteo</span></footer>
</main>
<script>
const weekday=["DOMINGO","SEGUNDA","TERÇA","QUARTA","QUINTA","SEXTA","SÁBADO"],month=["JANEIRO","FEVEREIRO","MARÇO","ABRIL","MAIO","JUNHO","JULHO","AGOSTO","SETEMBRO","OUTUBRO","NOVEMBRO","DEZEMBRO"],dow=["DOM","SEG","TER","QUA","QUI","SEX","SÁB"];
const $=id=>document.getElementById(id),clockEl=$("clock"),clockDateEl=$("clockDate"),placeEl=$("place"),wxIconEl=$("wxIcon"),tempNowEl=$("tempNow"),descNowEl=$("descNow"),feelsEl=$("feels"),windEl=$("wind"),humidityEl=$("humidity"),rainEl=$("rain"),updatedEl=$("updated"),daysEl=$("days"),rangeEl=$("range"),todayMinEl=$("todayMin"),todayMaxEl=$("todayMax"),feelCard=$("feelCard"),feelIcon=$("feelIcon");
const pad=n=>String(n).padStart(2,"0");
function updateClock(){const d=new Date();clockEl.textContent=`${pad(d.getHours())}:${pad(d.getMinutes())}`;clockDateEl.textContent=`${weekday[d.getDay()]}, ${pad(d.getDate())} DE ${month[d.getMonth()]}`}
updateClock();setInterval(updateClock,1000);
function dayTheme(){const h=new Date().getHours(),r=document.documentElement;if(h>=6&&h<12){r.style.setProperty('--bg1','#0b56ad');r.style.setProperty('--bg2','#08458f')}else if(h<18){r.style.setProperty('--bg1','#0a4ea5');r.style.setProperty('--bg2','#043775')}else{r.style.setProperty('--bg1','#063a7c');r.style.setProperty('--bg2','#022656')}}dayTheme();setInterval(dayTheme,600000);
function fetchTimeout(url,ms=5000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);return fetch(url,{cache:'no-store',signal:c.signal}).finally(()=>clearTimeout(t))}function norm(v){if(v==null)return null;const s=String(v).trim();return s||null}function num(v){const n=Number(v);return Number.isFinite(n)?n:null}
async function locate(){const ps=[async()=>{const r=await fetchTimeout('https://ipwho.is/?lang=pt');const d=await r.json();if(!d||d.success===false)throw 0;return{city:norm(d.city),region:norm(d.region_code||d.region),country:norm(d.country_code),lat:num(d.latitude),lon:num(d.longitude)}},async()=>{const r=await fetchTimeout('https://ipapi.co/json/');const d=await r.json();return{city:norm(d.city),region:norm(d.region_code||d.region),country:norm(d.country_code),lat:num(d.latitude),lon:num(d.longitude)}},async()=>{const r=await fetchTimeout('https://geolocation-db.com/json/');const d=await r.json();return{city:norm(d.city),region:norm(d.state),country:norm(d.country_code),lat:num(d.latitude),lon:num(d.longitude)}}];for(const p of ps){try{const x=await p();if(x.city||(x.lat!=null&&x.lon!=null))return x}catch{}}throw Error('location')}
function place(x){const c=x.city?.toUpperCase(),r=x.region?.toUpperCase(),co=x.country?.toUpperCase();return c&&r?`${c} · ${r}`:c&&co?`${c} · ${co}`:c||'LOCAL NÃO IDENTIFICADO'}
function wx(code){if(code===0)return{icon:'wb_sunny',desc:'CÉU LIMPO',color:'#ffd36b'};if(code===1||code===2)return{icon:'wb_cloudy',desc:'PARCIALMENTE NUBLADO',color:'#d7f2ff'};if(code===3)return{icon:'cloud',desc:'NUBLADO',color:'#d7e9f7'};if(code===45||code===48)return{icon:'blur_on',desc:'NEBLINA',color:'#dbe8ef'};if([51,53,55].includes(code))return{icon:'grain',desc:'GAROA',color:'#8edcff'};if([56,57].includes(code))return{icon:'ac_unit',desc:'GAROA CONGELANTE',color:'#d6eeff'};if([61,63,65].includes(code))return{icon:'umbrella',desc:'CHUVA',color:'#72d0ff'};if([66,67].includes(code))return{icon:'ac_unit',desc:'CHUVA CONGELANTE',color:'#cbe9ff'};if([71,73,75,77].includes(code))return{icon:'ac_unit',desc:'NEVE',color:'#edf8ff'};if([80,81,82].includes(code))return{icon:'water_drop',desc:'PANCADAS DE CHUVA',color:'#69cff2'};if([85,86].includes(code))return{icon:'ac_unit',desc:'PANCADAS DE NEVE',color:'#edf8ff'};if([95,96,99].includes(code))return{icon:'flash_on',desc:'TEMPESTADE',color:'#b9d7ff'};return{icon:'cloud',desc:'CLIMA',color:'#d8f2ff'}}
function dayLabel(s,i){if(i===0)return'HOJE';if(i===1)return'AMANHÃ';return dow[new Date(s+'T12:00:00').getDay()]}function dayNum(s){const d=new Date(s+'T12:00:00');return`${pad(d.getDate())}/${pad(d.getMonth()+1)}`}
async function weather(lat,lon){const u=new URL('https://api.open-meteo.com/v1/forecast');u.searchParams.set('latitude',lat);u.searchParams.set('longitude',lon);u.searchParams.set('timezone','auto');u.searchParams.set('current','temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m');u.searchParams.set('daily','weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max');u.searchParams.set('forecast_days','6');return(await fetchTimeout(u,6500)).json()}
function renderDaily(d){daysEl.innerHTML='';const ts=d.time||[],codes=d.weather_code||[],max=d.temperature_2m_max||[],min=d.temperature_2m_min||[],pop=d.precipitation_probability_max||[];if(!ts.length)return;rangeEl.textContent=`${dayNum(ts[0])} · ${dayNum(ts.at(-1))}`;todayMinEl.textContent=Number.isFinite(min[0])?`${Math.round(min[0])}°`:'--°';todayMaxEl.textContent=Number.isFinite(max[0])?`${Math.round(max[0])}°`:'--°';ts.forEach((s,i)=>{const w=wx(codes[i]),el=document.createElement('div');el.className='day'+(i===0?' today':'');el.innerHTML=`<div class="day-date"><span class="day-label">${dayLabel(s,i)}</span><span class="day-number">${dayNum(s)}</span></div><span class="day-icon" style="--day:${w.color};animation-delay:${(i*.25).toFixed(2)}s">${w.icon}</span><div class="day-meta"><div class="day-desc">${w.desc}</div><div class="rain"><span class="material-icons-outlined">water_drop</span><span>${Number.isFinite(pop[i])?Math.round(pop[i])+'%':'—'}</span></div></div><div class="temps"><div class="chip min"><small>mín</small><strong>${Number.isFinite(min[i])?Math.round(min[i])+'°':'—'}</strong></div><div class="chip"><small>máx</small><strong>${Number.isFinite(max[i])?Math.round(max[i])+'°':'—'}</strong></div></div>`;daysEl.appendChild(el)})}
function thermalEffect(actual,feels){feelCard.classList.remove('feel-hot','feel-cold');feelIcon.textContent='device_thermostat';if(!Number.isFinite(actual)||!Number.isFinite(feels))return;const diff=feels-actual;if(diff>=4){feelCard.classList.add('feel-hot');feelIcon.textContent='whatshot'}else if(diff<=-4){feelCard.classList.add('feel-cold');feelIcon.textContent='ac_unit'}}
function updated(){const d=new Date();updatedEl.textContent=`Atualizado às ${pad(d.getHours())}:${pad(d.getMinutes())}`}
async function refresh(){try{placeEl.textContent='LOCALIZANDO…';const loc=await locate();placeEl.textContent=place(loc);if(loc.lat==null||loc.lon==null)throw 0;const data=await weather(loc.lat,loc.lon),c=data.current||{},w=wx(c.weather_code);wxIconEl.textContent=w.icon;descNowEl.textContent=w.desc;document.documentElement.style.setProperty('--wx',w.color);const t=Number(c.temperature_2m),f=Number(c.apparent_temperature);tempNowEl.textContent=Number.isFinite(t)?`${Math.round(t)}°`:'--°';feelsEl.textContent=Number.isFinite(f)?`${Math.round(f)}°`:'—';thermalEffect(t,f);const wind=Number(c.wind_speed_10m),hum=Number(c.relative_humidity_2m),rain=Number(c.precipitation);windEl.textContent=Number.isFinite(wind)?`${Math.round(wind)} km/h`:'—';humidityEl.textContent=Number.isFinite(hum)?`${Math.round(hum)}%`:'—';rainEl.textContent=Number.isFinite(rain)?`${rain.toFixed(1)} mm`:'—';if(data.daily)renderDaily(data.daily);updated()}catch(e){placeEl.textContent='SEM CONEXÃO';wxIconEl.textContent='cloud_off';descNowEl.textContent='DADOS INDISPONÍVEIS';updated();console.warn(e)}}
refresh();setInterval(refresh,20*60*1000);
</script>
</body>
</html>
